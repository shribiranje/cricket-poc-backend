name: Deploy Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Docker image
        run: |
          docker build -t cricket-backend:poc .

      - name: Verify Docker image
        run: |
          docker images cricket-backend

      - name: Save Docker image
        run: |
          docker save cricket-backend:poc | gzip > backend-image.tar.gz
          ls -lh backend-image.tar.gz

      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend-image.tar.gz"
          target: "/home/ec2-user/"

      - name: Deploy Backend on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting Backend Deployment"
            echo "======================================"

            echo "Loading new backend Docker image..."

            gunzip -c /home/ec2-user/backend-image.tar.gz | docker load

            echo "Docker image loaded successfully."

            echo "Finding Docker Compose file..."

            COMPOSE_FILE=$(find /home/ec2-user/cricket-poc \
              -type f \
              -path "*/deploy/docker-compose.yml" \
              | head -n 1)

            if [ -z "$COMPOSE_FILE" ]; then
              echo "ERROR: docker-compose.yml not found!"
              find /home/ec2-user/cricket-poc -name docker-compose.yml -type f
              exit 1
            fi

            echo "Compose file found:"
            echo "$COMPOSE_FILE"

            DEPLOY_DIR=$(dirname "$COMPOSE_FILE")

            echo "Deployment directory:"
            echo "$DEPLOY_DIR"

            echo "Checking deployment files..."
            ls -la "$DEPLOY_DIR"

            echo "Checking current containers..."
            docker compose \
              -f "$COMPOSE_FILE" \
              ps

            echo "Deploying backend container..."

            docker compose \
              -f "$COMPOSE_FILE" \
              up -d \
              --no-deps \
              --force-recreate \
              backend

            echo "Backend deployment completed."

            echo "Removing temporary image file..."

            rm -f /home/ec2-user/backend-image.tar.gz

            echo "Checking backend container..."

            docker compose \
              -f "$COMPOSE_FILE" \
              ps backend

            echo "All containers..."

            docker ps

            echo "======================================"
            echo "Backend Deployment SUCCESS"
            echo "======================================"
