name: Deploy Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Docker image
        run: |
          docker build -t cricket-backend:poc .

      - name: Save Docker image
        run: |
          docker save cricket-backend:poc | gzip > backend-image.tar.gz
          ls -lh backend-image.tar.gz

      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend-image.tar.gz"
          target: "/home/ec2-user/"

      - name: Deploy Backend on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting Backend Deployment"
            echo "======================================"

            echo "Loading new backend Docker image..."

            gunzip -c /home/ec2-user/backend-image.tar.gz | docker load

            echo "Docker image loaded successfully."

            COMPOSE_FILE="/home/ec2-user/cricket-poc/dist_20260715/deploy/docker-compose.yml"

            echo "Using Compose file:"
            echo "$COMPOSE_FILE"

            test -f "$COMPOSE_FILE"

            echo "Checking current containers..."

            docker compose -f "$COMPOSE_FILE" ps

            echo "Deploying backend..."

            docker compose \
              -f "$COMPOSE_FILE" \
              up -d \
              --no-deps \
              --force-recreate \
              backend

            echo "Backend deployment completed."

            rm -f /home/ec2-user/backend-image.tar.gz

            echo "Backend container status:"

            docker compose \
              -f "$COMPOSE_FILE" \
              ps backend

            echo "All containers:"

            docker ps

            echo "======================================"
            echo "Backend Deployment SUCCESS"
            echo "======================================"
